services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: campus_nexus
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus_dev
    ports: ["5432:5432"]
    volumes: ["campus_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus_nexus"]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://campus:campus_dev@db:5432/campus_nexus
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-demo-only-change-before-deployment
      UPLOAD_DIR: /app/uploads
    ports: ["8000:8000"]
    volumes: ["campus_uploads:/app/uploads"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  campus_db:
  campus_uploads:
